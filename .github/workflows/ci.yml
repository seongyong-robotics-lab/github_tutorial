name: CI

# 조직 공통 워크플로를 호출한다. 실제 스텝은 여기 없다:
#   seongyong-robotics-lab/.github/.github/workflows/python-ci.yml
#
# repo 가 늘면 같은 CI 를 복사하게 되고, 복사본은 반드시 갈라진다.
# 한 곳에 두면 Python 버전 하나 올리는 것이 PR 하나로 끝난다.
#
# @v1 로 고정한 이유:
#   @main 으로 참조하면 공통 워크플로의 변경이 즉시 모든 repo 에 퍼진다.
#   편하지만 거기서 실수하면 조직 전체 CI 가 동시에 깨진다.
#   태그를 옮기는 것으로 배포하면 언제 무엇이 바뀌었는지가 남는다.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-shared-ci:
    uses: seongyong-robotics-lab/.github/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.12"
      lint: true
