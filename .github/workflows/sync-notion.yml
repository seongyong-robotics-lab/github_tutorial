name: Sync to Notion

# 이슈가 닫히거나 다시 열리면 Notion SYS-REQ 의 `구현 상태` 를 갱신한다.
#
# 한쪽 방향으로만 흐른다:
#   GitHub 이슈 상태  ──▶  Notion 구현 상태
#
# 반대 방향(Notion -> GitHub)은 만들지 않는다. 양방향으로 만들면 어느 쪽이
# 원본인지 알 수 없게 되고, 두 자동화가 서로를 트리거해 루프가 된다.
#
# opened 도 트리거인 이유:
#   완료된 REQ 에 새 이슈가 열리면 그 REQ 는 다시 진행 중이다. closed/reopened 만
#   보면 "Notion 은 완료인데 실제로는 열린 일이 있는" 상태가 조용히 생긴다.
#   edited 는 넣지 않는다 — 제목이 바뀌면 옛 REQ 는 갱신할 방법이 없어서
#   반쪽짜리가 된다. 그건 주간 점검으로 잡는다.
on:
  issues:
    types: [opened, closed, reopened]

permissions:
  contents: read
  issues: read # 같은 REQ 의 남은 열린 이슈를 세기 위해

jobs:
  sync:
    name: sync-to-notion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "requests>=2.32"

      - name: Sync issue state to Notion
        run: python tools/sync_notion.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_STATE_REASON: ${{ github.event.issue.state_reason }}
